    <style>
    html, body {
    font-family: "Helvetica", Arial, Helvetica, sans-serif;

    background-color: bisque;
}

p {
    font-family: "Helvetica", Arial, Helvetica, sans-serif;

}

h1 {

}

      .mainImage {
        border: 2px solid black;
        width: 650px;
        height: 500px;
        display: block;
        margin: 20px auto;
      }

      .thumbnail {
        width: 150px;
        height: 100px;
        cursor: pointer;

      }

      .center {
        text-align: center;

      footer {
      background-color: black;

}
    </style>
    <script>
      let originalImage = "images/13.jpg";
      let currentImage = originalImage;

      function displayImage(imageFile) {
        currentImage = imageFile;
        document.getElementById("mainImage").src = imageFile;
      }

      function showOriginal() {
        document.getElementById("mainImage").src = originalImage;
      }

      function restoreCurrent() {
        document.getElementById("mainImage").src = currentImage;
      }
    </script>
</head>

 <body>
    <h1 class="center">Assignment 10.3: JavaScript - Part 2</h1>
    <h2 style="font-weight: bold;">Instructions:</h2>
      <p>Click on photos underneath main image to enlarge.</p>
      <p>Hover over main image to restore back to first image.</p>
      <p>Move mouse away to restore back to selected image.</p>

      <div class="center">
      <img
        id="mainImage"
        src="images/13.jpg"
        alt="Main Display"
        class="mainImage"
        onmouseover="showOriginal()"
        onmouseout="restoreCurrent()"
      />
    </div>

    <div class="center">
      <img
        src="images/19.jpg"
        alt="Thumbnail 1"
        class="thumbnail"
        onclick="displayImage('images/19.jpg')"
      />
      <img
        src="images/20.jpg"
        alt="Thumbnail 2"
        class="thumbnail"
        onclick="displayImage('images/20.jpg')"
      />
      <img
        src="images/24.jpg"
        alt="Thumbnail 3"
        class="thumbnail"
        onclick="displayImage('images/24.jpg')"
      />
    </div>
  </body>
